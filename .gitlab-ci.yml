stages:
  - test
  - verify
  - audit

# CARGO_HOME points into the project dir so the registry/bin caches below actually take effect.
variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_TERM_COLOR: "always"

default:
  image: rust:1.89-bookworm@sha256:948f9b08a66e7fe01b03a98ef1c7568292e07ec2e4fe90d88c07bb14563c84ff
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/registry/
      - .cargo/bin/
      - target/

tests:
  stage: test
  script:
    - cargo test --locked --all-targets

quality:
  stage: verify
  before_script:
    - rustup component add rustfmt clippy
  script:
    - cargo fmt --all -- --check
    - cargo clippy --locked --all-targets -- -D warnings
    - cargo build --locked --release

rustsec:
  stage: audit
  script:
    - cargo install cargo-audit --locked --version 0.22.2
    - cargo audit --file Cargo.lock

coverage:
  stage: audit
  before_script:
    - rustup component add llvm-tools-preview
    - cargo install cargo-llvm-cov --locked
  script:
    - cargo llvm-cov --locked --all-targets --fail-under-lines 80 --summary-only
