services:
  swarm-mcp:
    build: .
    image: demlabs/swarm-mcp:local
    container_name: dev-swarm-mcp
    restart: unless-stopped
    environment:
      SWARM_MCP_HOST: ${SWARM_MCP_HOST}
      SWARM_MCP_PORT: ${SWARM_MCP_PORT}
      SWARM_MCP_ALLOWED_HOSTS: ${SWARM_MCP_ALLOWED_HOSTS}
      SWARM_MCP_ALLOWED_ORIGINS: ${SWARM_MCP_ALLOWED_ORIGINS}
      SWARM_MCP_MAX_REQUEST_BODY_BYTES: ${SWARM_MCP_MAX_REQUEST_BODY_BYTES}
      SWARM_ROLE_MCP_PATH_TEMPLATE: ${SWARM_ROLE_MCP_PATH_TEMPLATE}
      SWARM_ACTIVITY_SIGNAL_PATH: ${SWARM_ACTIVITY_SIGNAL_PATH}
      SWARM_ACTIVITY_ENABLED: ${SWARM_ACTIVITY_ENABLED}
      SWARM_ACTIVITY_ROUTES: ${SWARM_ACTIVITY_ROUTES}
      SWARM_STATE_DB_PATH: ${SWARM_STATE_DB_PATH}
      SWARM_DB_MAX_CONNECTIONS: ${SWARM_DB_MAX_CONNECTIONS}
      SWARM_DB_BUSY_TIMEOUT_SECONDS: ${SWARM_DB_BUSY_TIMEOUT_SECONDS}
      SWARM_ACTIVITY_RETENTION_DAYS: ${SWARM_ACTIVITY_RETENTION_DAYS}
      SWARM_ACTIVITY_HISTORY_LIMIT: ${SWARM_ACTIVITY_HISTORY_LIMIT}
      SWARM_ACTIVITY_STALE_AFTER_SECONDS: ${SWARM_ACTIVITY_STALE_AFTER_SECONDS}
      SWARM_ACTIVITY_CLOCK_SKEW_SECONDS: ${SWARM_ACTIVITY_CLOCK_SKEW_SECONDS}
      SWARM_AGENT_ROLES: ${SWARM_AGENT_ROLES}
      SWARM_MANAGER_ROLE: ${SWARM_MANAGER_ROLE}
      SWARM_EXECUTOR_DESCRIPTIONS: ${SWARM_EXECUTOR_DESCRIPTIONS}
      SWARM_MAX_MESSAGE_CHARS: ${SWARM_MAX_MESSAGE_CHARS}
      SWARM_API_TIMEOUT_SECONDS: ${SWARM_API_TIMEOUT_SECONDS}
      SWARM_HERMES_MODEL_ALIAS: ${SWARM_HERMES_MODEL_ALIAS}
      SWARM_LOG_LEVEL: ${SWARM_LOG_LEVEL}
      SWARM_DISPATCH_RATE_LIMIT: ${SWARM_DISPATCH_RATE_LIMIT}
      SWARM_DISPATCH_RATE_WINDOW_SECONDS: ${SWARM_DISPATCH_RATE_WINDOW_SECONDS}
      SWARM_MAX_INFLIGHT_DISPATCHES: ${SWARM_MAX_INFLIGHT_DISPATCHES}
      SWARM_RECENT_OPERATIONS_LIMIT: ${SWARM_RECENT_OPERATIONS_LIMIT}
      SWARM_OPERATION_RETENTION_DAYS: ${SWARM_OPERATION_RETENTION_DAYS}
      SWARM_REPORT_STATUSES: ${SWARM_REPORT_STATUSES}
      SWARM_PENDING_STALE_SECONDS: ${SWARM_PENDING_STALE_SECONDS}
      SWARM_CLEANUP_INTERVAL_SECONDS: ${SWARM_CLEANUP_INTERVAL_SECONDS}
      SWARM_MCP_REQUEST_RATE_LIMIT: ${SWARM_MCP_REQUEST_RATE_LIMIT}
      SWARM_MCP_REQUEST_RATE_WINDOW_SECONDS: ${SWARM_MCP_REQUEST_RATE_WINDOW_SECONDS}
      SWARM_ORDER_ACL: ${SWARM_ORDER_ACL}
      SWARM_MANAGER_MCP_INSTRUCTIONS: ${SWARM_MANAGER_MCP_INSTRUCTIONS}
      SWARM_EXECUTOR_MCP_INSTRUCTIONS: ${SWARM_EXECUTOR_MCP_INSTRUCTIONS}
      SWARM_AUTHORITY_MCP_INSTRUCTIONS: ${SWARM_AUTHORITY_MCP_INSTRUCTIONS}
      SWARM_EXECUTOR_RUN_INSTRUCTIONS: ${SWARM_EXECUTOR_RUN_INSTRUCTIONS}
      SWARM_SUPERVISOR_REPORT_INSTRUCTIONS: ${SWARM_SUPERVISOR_REPORT_INSTRUCTIONS}
      SWARM_PEER_RUN_INSTRUCTIONS: ${SWARM_PEER_RUN_INSTRUCTIONS}
      SWARM_ORDER_PROMPT_TEMPLATE: ${SWARM_ORDER_PROMPT_TEMPLATE}
      SWARM_REPORT_PROMPT_TEMPLATE: ${SWARM_REPORT_PROMPT_TEMPLATE}
      SWARM_PEER_PROMPT_TEMPLATE: ${SWARM_PEER_PROMPT_TEMPLATE}
      SWARM_TELEGRAM_ENABLED: ${SWARM_TELEGRAM_ENABLED}
      SWARM_TELEGRAM_BOT_MODE: ${SWARM_TELEGRAM_BOT_MODE}
      SWARM_TELEGRAM_BOT_TOKEN: ${SWARM_TELEGRAM_BOT_TOKEN:-}
      SWARM_TELEGRAM_TIMEOUT_SECONDS: ${SWARM_TELEGRAM_TIMEOUT_SECONDS}
      SWARM_TELEGRAM_MESSAGE_LIMIT: ${SWARM_TELEGRAM_MESSAGE_LIMIT}
      SWARM_TELEGRAM_INBOUND_ENABLED: ${SWARM_TELEGRAM_INBOUND_ENABLED}
      SWARM_TELEGRAM_INBOUND_TARGETS: ${SWARM_TELEGRAM_INBOUND_TARGETS}
      SWARM_TELEGRAM_POLL_TIMEOUT_SECONDS: ${SWARM_TELEGRAM_POLL_TIMEOUT_SECONDS}
      SWARM_TELEGRAM_POLL_LIMIT: ${SWARM_TELEGRAM_POLL_LIMIT}
      SWARM_TELEGRAM_PROCESS_BACKLOG: ${SWARM_TELEGRAM_PROCESS_BACKLOG}
      SWARM_TELEGRAM_INBOUND_RUN_INSTRUCTIONS: ${SWARM_TELEGRAM_INBOUND_RUN_INSTRUCTIONS}
      SWARM_TELEGRAM_INBOUND_PROMPT_TEMPLATE: ${SWARM_TELEGRAM_INBOUND_PROMPT_TEMPLATE}
      SWARM_OUTBOX_POLL_INTERVAL_SECONDS: ${SWARM_OUTBOX_POLL_INTERVAL_SECONDS}
      SWARM_OUTBOX_MAX_ATTEMPTS: ${SWARM_OUTBOX_MAX_ATTEMPTS}
      SWARM_OUTBOX_BATCH_SIZE: ${SWARM_OUTBOX_BATCH_SIZE}
      SWARM_OUTBOX_RETENTION_DAYS: ${SWARM_OUTBOX_RETENTION_DAYS}
      TELEGRAM_GROUP_ID: ${TELEGRAM_GROUP_ID}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS}
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL}
      MANAGER_SWARM_MCP_TOKEN: ${MANAGER_SWARM_MCP_TOKEN}
      DEVELOPER_SWARM_MCP_TOKEN: ${DEVELOPER_SWARM_MCP_TOKEN}
      JUNIOR_SWARM_MCP_TOKEN: ${JUNIOR_SWARM_MCP_TOKEN}
      DESIGNER_SWARM_MCP_TOKEN: ${DESIGNER_SWARM_MCP_TOKEN}
      LEAD_DEVELOPER_SWARM_MCP_TOKEN: ${LEAD_DEVELOPER_SWARM_MCP_TOKEN}
      TESTER_SWARM_MCP_TOKEN: ${TESTER_SWARM_MCP_TOKEN}
      DEVOPS_SWARM_MCP_TOKEN: ${DEVOPS_SWARM_MCP_TOKEN}
      MANAGER_TELEGRAM_BOT_TOKEN: ${MANAGER_TELEGRAM_BOT_TOKEN:-}
      DEVELOPER_TELEGRAM_BOT_TOKEN: ${DEVELOPER_TELEGRAM_BOT_TOKEN:-}
      JUNIOR_TELEGRAM_BOT_TOKEN: ${JUNIOR_TELEGRAM_BOT_TOKEN:-}
      DESIGNER_TELEGRAM_BOT_TOKEN: ${DESIGNER_TELEGRAM_BOT_TOKEN:-}
      LEAD_DEVELOPER_TELEGRAM_BOT_TOKEN: ${LEAD_DEVELOPER_TELEGRAM_BOT_TOKEN:-}
      TESTER_TELEGRAM_BOT_TOKEN: ${TESTER_TELEGRAM_BOT_TOKEN:-}
      DEVOPS_TELEGRAM_BOT_TOKEN: ${DEVOPS_TELEGRAM_BOT_TOKEN:-}
      MANAGER_API_URL: ${MANAGER_API_URL}
      MANAGER_AGENT_API_KEY: ${MANAGER_AGENT_API_KEY}
      DEVELOPER_API_URL: ${DEVELOPER_API_URL}
      DEVELOPER_AGENT_API_KEY: ${DEVELOPER_AGENT_API_KEY}
      JUNIOR_API_URL: ${JUNIOR_API_URL}
      JUNIOR_AGENT_API_KEY: ${JUNIOR_AGENT_API_KEY}
      DESIGNER_API_URL: ${DESIGNER_API_URL}
      DESIGNER_AGENT_API_KEY: ${DESIGNER_AGENT_API_KEY}
      LEAD_DEVELOPER_API_URL: ${LEAD_DEVELOPER_API_URL}
      LEAD_DEVELOPER_AGENT_API_KEY: ${LEAD_DEVELOPER_AGENT_API_KEY}
      TESTER_API_URL: ${TESTER_API_URL}
      TESTER_AGENT_API_KEY: ${TESTER_AGENT_API_KEY}
      DEVOPS_API_URL: ${DEVOPS_API_URL}
      DEVOPS_AGENT_API_KEY: ${DEVOPS_AGENT_API_KEY}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: ${SWARM_MCP_MEMORY_LIMIT:-512m}
    cpus: ${SWARM_MCP_CPU_LIMIT:-1.0}
    pids_limit: ${SWARM_MCP_PIDS_LIMIT:-256}
    logging:
      driver: json-file
      options:
        max-size: ${SWARM_LOG_MAX_SIZE:-10m}
        max-file: ${SWARM_LOG_MAX_FILES:-5}
    volumes:
      - ../swarm/data/swarm-mcp:/data:rw
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks: [swarm]

networks:
  swarm:
    external: true
    name: demlabs-dev-swarm
