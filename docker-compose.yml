services:
  swarm-mcp:
    build: .
    image: demlabs/swarm-mcp:local
    container_name: dev-swarm-mcp
    restart: unless-stopped
    # Полный конфиг роя (роли, креды, промпты) — в ../swarm/.env
    # Единственный источник переменных окружения: env_file. Не дублируйте
    # переменные в environment: — их ${VAR}-интерполяция читает shell/корневой
    # .env, а не env_file, и пустое значение ПЕРЕКРОЕТ значение из env_file.
    env_file:
      - ../swarm/.env
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: ${SWARM_MCP_MEMORY_LIMIT:-512m}
    cpus: ${SWARM_MCP_CPU_LIMIT:-1.0}
    pids_limit: ${SWARM_MCP_PIDS_LIMIT:-256}
    logging:
      driver: json-file
      options:
        max-size: ${SWARM_LOG_MAX_SIZE:-10m}
        max-file: ${SWARM_LOG_MAX_FILES:-5}
    volumes:
      - ../swarm/data/swarm-mcp:/data:rw
    tmpfs:
      - /tmp:size=16m,mode=1777
    network_mode: host
