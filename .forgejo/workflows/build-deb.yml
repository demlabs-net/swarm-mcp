name: build-deb
# Mirrors scripts/build-deb.sh inside the pinned builder image and publishes
# the package to the DemLabs apt repo (deb.zeus.demlabs) via the aptly API.
on:
  push:
    branches: [develop, main]
    tags: ["v*"]

jobs:
  deb:
    runs-on: deb-build-swarm
    steps:
      - name: checkout
        # actions/checkout needs node, which the pinned rust image lacks
        run: |
          git init -q .
          git remote add origin "http://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch -q origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: install cargo-deb
        run: cargo install cargo-deb --locked --version 3.7.0
      - name: build
        run: cargo deb --locked --output dist
      - name: publish
        run: bash ci/publish-deb.sh swarm-mcp dist/swarm-mcp_*.deb
