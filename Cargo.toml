[package]
name = "swarm-mcp"
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Authenticated, role-aware MCP communication plane for agent swarms"

[package.metadata.deb]
maintainer = "DemLabs <dev@demlabs.net>"
copyright = "2026 DemLabs"
depends = "ca-certificates"
section = "net"
priority = "optional"
extended-description = """Authenticated, role-aware MCP communication plane for agent swarms:
Telegram router (shared bot), role hierarchy, dispatch, outbox and MCP server."""
assets = [
  ["target/release/swarm-mcp", "usr/local/bin/", "755"],
  ["packaging/swarm-mcp.service", "lib/systemd/system/", "644"],
]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
axum = { version = "0.8", features = ["http1", "json", "macros", "tokio"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
http = "1"
regex = "1.11"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "multipart", "rustls", "socks", "stream"] }
rmcp = { version = "3.1.1", default-features = false, features = [
  "client",
  "server",
  "transport-streamable-http-client-reqwest",
  "transport-streamable-http-server",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5"
uuid = { version = "1.18", features = ["serde", "v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
needless_raw_string_hashes = "allow"
too_many_lines = "allow"
